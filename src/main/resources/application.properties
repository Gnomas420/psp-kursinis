spring.application.name=partijapro
server.port=${PORT:8080}

# in-memory H2 for now, tables are recreated on every start (Postgres + Docker in stage III)
spring.datasource.url=jdbc:h2:mem:partijapro;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# http://localhost:8080/h2-console
spring.h2.console.enabled=true

# load demo tenants and batches on startup
partijapro.demo-data=true
